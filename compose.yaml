services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cosmicdesk
      MYSQL_USER: cosmicdesk
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      retries: 30
  web:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3014
      DB_HOST: db
      DB_USER: cosmicdesk
      DB_NAME: cosmicdesk
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      TRUST_PROXY: 1
    volumes:
      - ./config.js:/app/config.js:ro
    ports:
      - "127.0.0.1:3014:3014"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node src/migrate.js && node server.js"]
    restart: unless-stopped
volumes:
  mysql_data:
