name: Helpdesk checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: cosmicdesk
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize original schema and migrate twice
        env:
          MYSQL_PWD: testroot
        run: |
          mysql -h 127.0.0.1 -u root cosmicdesk < schema.sql
          cp config.example.js config.js
          DB_USER=root DB_PASSWORD=testroot npm run migrate
          DB_USER=root DB_PASSWORD=testroot npm run migrate
      - run: npm run check
      - run: npm test
        env:
          TEST_MYSQL: '1'
      - run: npm audit --omit=dev
